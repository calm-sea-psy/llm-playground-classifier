<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서비스 상태</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --border:#e2e5ea; --text:#1c2230; --muted:#6b7385;
          --up:#1e8e5a; --warn:#b7791f; --down:#d23f3f; --start:#2f5bea; --stop:#7a8294; color-scheme: light dark;
          font-family: system-ui, 'Segoe UI', 'Malgun Gothic', sans-serif; font-size: 15px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1a1e27; --border:#2d3340; --text:#e6e9ef; --muted:#949cad;
            --up:#4cc38a; --warn:#e0a84a; --down:#f07171; --start:#7c9cff; --stop:#8a92a3; }
  }
  body { margin:0; background:var(--bg); color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:1.5rem 1rem 3rem; }
  h1 { font-size:1.3rem; margin:0 0 .25rem; } h2 { font-size:1rem; margin:1.5rem 0 .5rem; }
  .muted { color:var(--muted); } .small { font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:.75rem; margin-top:1rem; }
  .card { background:var(--card); border:1px solid var(--border); border-left:4px solid var(--muted); border-radius:10px; padding:.8rem 1rem; }
  .card.Up { border-left-color:var(--up); } .card.Warning { border-left-color:var(--warn); }
  .card.Down { border-left-color:var(--down); } .card.Starting { border-left-color:var(--start); } .card.Stopped { border-left-color:var(--stop); }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .name { font-weight:700; }
  .badge { font-size:.75rem; font-weight:700; padding:.1rem .55rem; border-radius:999px; color:#fff; background:var(--muted); }
  .badge.Up { background:var(--up); } .badge.Warning { background:var(--warn); }
  .badge.Down { background:var(--down); } .badge.Starting { background:var(--start); } .badge.Stopped { background:var(--stop); }
  .reason { margin:.4rem 0; font-size:.88rem; min-height:1.2em; word-break:break-all; }
  .meta { font-size:.78rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:.2rem .8rem; }
  .gaveup { color:var(--down); font-weight:700; font-size:.82rem; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem .75rem; margin-top:.75rem; padding:.7rem 1rem;
         background:var(--card); border:1px solid var(--border); border-radius:10px; }
  .bar .state { font-weight:700; } .bar .state.on { color:var(--up); } .bar .state.off { color:var(--stop); }
  .bar .grow { flex:1; min-width:12rem; }
  .bar button { margin-top:0; font-size:.88rem; padding:.35rem .9rem; }
  button.primary { background:var(--up); border-color:var(--up); color:#fff; }
  button.danger { color:var(--down); border-color:var(--down); }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:.4rem; }
  button { margin-top:.5rem; font:inherit; font-size:.8rem; padding:.25rem .7rem; border-radius:6px;
           border:1px solid var(--border); background:var(--card); color:inherit; cursor:pointer; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  td, th { text-align:left; padding:.4rem .6rem; border-bottom:1px solid var(--border); font-size:.85rem; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.78rem; }
  .k-Down, .k-RestartFailed, .k-GaveUp { color:var(--down); } .k-Warning { color:var(--warn); }
  .k-Up, .k-RestartSucceeded, .k-WatchStarted { color:var(--up); } .k-RestartAttempt { color:var(--start); }
  .k-Stopped, .k-WatchStopped { color:var(--stop); } .k-StopFailed { color:var(--down); }
  .table-wrap { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>서비스 상태</h1>
  <div class="muted small" id="tick">불러오는 중…</div>
  <div class="bar">
    <span class="state" id="watch">—</span>
    <span class="muted small grow" id="watch-help"></span>
    <button class="primary" id="watch-start" onclick="startWatching()">감시 시작</button>
    <button class="danger" id="stop-all" onclick="stopAll()">모두 중지</button>
  </div>
  <div class="grid" id="targets"></div>
  <h2>이벤트</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>시각</th><th>대상</th><th>종류</th><th>내용</th></tr></thead>
    <tbody id="events"></tbody>
  </table></div>
</main>
<script>
  const label = { Up: '정상', Warning: '주의', Down: '중단', Starting: '시작 중', Unknown: '확인 중', Stopped: '중지' };
  const kindLabel = { Down: '중단', Up: '복구', Warning: '주의', RestartAttempt: '재시작 시도', RestartSucceeded: '재시작 성공',
    RestartFailed: '재시작 실패', GaveUp: '재시작 포기', Stopped: '중지', StopFailed: '중지 실패',
    WatchStarted: '감시 시작', WatchStopped: '감시 멈춤' };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const time = s => s ? new Date(s).toLocaleTimeString('ko-KR') : '—';

  // 버튼 요청은 워커가 다음 주기에 처리 (중지는 대상마다 최대 몇 초) ➔ 잠깐 버튼을 막고 새로 고침
  async function post(url, button) {
    if (button) button.disabled = true;
    try { await fetch(url, { method: 'POST' }); } finally { setTimeout(refresh, 300); }
  }
  const restart = (name, button) => post(`/targets/${encodeURIComponent(name)}/restart`, button);
  const stop = (name, button) => post(`/targets/${encodeURIComponent(name)}/stop`, button);
  const startWatching = () => post('/watch/start', document.getElementById('watch-start'));
  function stopAll() {
    if (!confirm('모든 서버를 중지하고 감시를 멈출까요? (Ollama 는 감시만 하므로 그대로 둡니다)')) return;
    post('/targets/stop-all', document.getElementById('stop-all'));
  }

  function actions(t) {
    if (!t.manageable) return '<div class="actions"><span class="muted small" style="margin-top:.5rem">감시만 (시작 · 중지는 직접)</span></div>';
    const n = esc(t.name);
    const off = t.state === 'Stopped' || t.state === 'Down';
    return `<div class="actions">
      <button onclick="restart('${n}', this)">${off ? '시작' : '재시작'}</button>
      ${t.state === 'Stopped' ? '' : `<button class="danger" onclick="stop('${n}', this)">중지</button>`}
    </div>`;
  }

  async function refresh() {
    try {
      const [status, events] = await Promise.all([
        fetch('/status').then(r => r.json()),
        fetch('/events?take=50').then(r => r.json()),
      ]);
      document.getElementById('tick').textContent = `마지막 체크 ${time(status.lastTickAt)} · 10초 주기`;
      const watch = document.getElementById('watch');
      watch.textContent = status.watching ? '감시 중' : '감시 꺼짐';
      watch.className = 'state ' + (status.watching ? 'on' : 'off');
      document.getElementById('watch-help').textContent = status.watching
        ? '꺼진 서버는 자동 재시작 (중지한 서버는 제외). 끝낼 때: 모두 중지 ➔ 터미널 종료'
        : '상태 확인만 합니다. 감시 시작을 누르면 꺼진 서버를 의존 순서대로 켜고 자동 재시작합니다';
      document.getElementById('watch-start').disabled = status.watching;
      document.getElementById('stop-all').disabled = false;
      document.getElementById('targets').innerHTML = status.targets.map(t => `
        <section class="card ${t.state}">
          <div class="head"><span class="name">${esc(t.name)}</span><span class="badge ${t.state}">${label[t.state] ?? t.state}</span></div>
          <div class="reason">${esc(t.reason) || '<span class="muted">—</span>'}</div>
          ${t.gaveUp ? '<div class="gaveup">자동 재시작 중단 · 수동 조치 필요</div>' : ''}
          <div class="meta">
            <span>체크 ${time(t.lastCheckAt)} (${t.lastCheckMs}ms)</span>
            <span>재시작 ${t.restartCount}회</span>
            ${t.pid ? `<span>PID ${t.pid}</span>` : ''}
            ${t.dependsOn.length ? `<span>의존: ${t.dependsOn.map(esc).join(', ')}</span>` : ''}
          </div>
          ${actions(t)}
        </section>`).join('');
      document.getElementById('events').innerHTML = events.map(e => `
        <tr><td>${new Date(e.at).toLocaleString('ko-KR')}</td><td>${esc(e.target)}</td>
            <td class="k-${e.kind}">${esc(kindLabel[e.kind] ?? e.kind)}</td><td>${esc(e.message)}</td></tr>`).join('');
    } catch {
      document.getElementById('tick').textContent = '모니터에 연결할 수 없습니다';
    }
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
