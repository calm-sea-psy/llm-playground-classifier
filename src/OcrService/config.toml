# OCR 서비스 설정
# 새 엔진 추가 = engines/ 에 어댑터 파일 1개 + 아래에 [engines.<이름>] 섹션 1개

[service]
default_engine = "paddleocr"
# 서버 시작 시 미리 로딩할 엔진 (첫 요청 지연 방지)
preload = ["paddleocr"]

[engines.paddleocr]
adapter = "engines.paddle:PaddleEngine"
lang = "korean"                      # ➔ PP-OCRv5_server_det + korean_PP-OCRv5_mobile_rec
device = "gpu:0"
# 줄 방향 보정(180° 뒤집힌 줄 바로잡기)은 끔: 똑바른 영수증 줄을 오히려 뒤집어 읽음 ("1,000" ➔ "000'1").
# 같은 150장 비교 (2026-09-25, eval/score_ocr.py): KORIE 필드 값 재현율 80.2% ➔ 84.8%, CER 7.56% ➔ 4.65%,
# 상업송장 CER 0.70% ➔ 0.33%, 속도도 약간 빠름. 실제로 뒤집혀 찍힌 줄은 못 바로잡는 대신
use_textline_orientation = false
# 문서 방향 보정·왜곡 펴기는 이미지 자체를 바꿔 bbox 좌표계가 원본과 달라지므로 끔
use_doc_orientation_classify = false
use_doc_unwarping = false
# 이보다 큰 이미지는 축소해서 인식 (약 9MP 초과 시 추론 시간 1초 ➔ 20초+, 2026-09-24 측정)
max_pixels = 8_500_000

# 경로 B: 문서 파싱 (레이아웃 + 표 HTML + 읽기 순서 Markdown). 모델 로딩 약 10초·VRAM 수 GB 라 요청 시 로딩
[engines.ppstructure]
adapter = "engines.structure:PaddleStructureEngine"
lang = "korean"
device = "gpu:0"
use_textline_orientation = false   # 경로 A 와 같은 이유로 끔
use_table_recognition = true
use_region_detection = true
max_pixels = 8_500_000

# CPU 판 (GPU 없는 PC 에서 되는지 측정용, 4차 0단계). 요청 시 로딩: POST /ocr?engine=paddleocr_cpu
[engines.paddleocr_cpu]
adapter = "engines.paddle:PaddleEngine"
lang = "korean"
device = "cpu"
enable_mkldnn = false   # paddle 3.4 CPU oneDNN 경로 오류 (NotImplementedError) ➔ 끔
use_textline_orientation = false
use_doc_orientation_classify = false
use_doc_unwarping = false
max_pixels = 8_500_000
