# 빌드 + 단위 테스트. GPU·Ollama·데이터가 필요한 평가(eval/)는 로컬에서만 돌린다
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET 빌드 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: 빌드 (API · 모니터링 · 배포용 프로그램 · 테스트)
        run: dotnet build llm-playground-classifier.slnx
      - name: 단위 테스트 (규칙 검증 · 프롬프트 검사 · 작업 기록 · 용어집)
        run: dotnet test tests/Api.Tests --no-build --logger "console;verbosity=normal"

  digitizer-app:
    name: 배포용 프로그램 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Digitizer.App/ClientApp/package-lock.json
      # 화면(ClientApp)은 App 빌드가 npm 으로 빌드. 린트만 따로
      - name: 화면 린트
        working-directory: src/Digitizer.App/ClientApp
        run: |
          npm ci
          npm run lint
      # 합격 표시(release)된 팩만 출력에 들어가는지 · 처리 코어 (설정 · SQLite 마이그레이션 · 대기열 · 감시 폴더 · 파일 이동 · 보관 기한, 가짜 OCR · LLM)
      # · 검수 (승인 조건 · 고친 값) · 엑셀 · 요청 차단
      - name: 테스트 (합격한 팩 · 처리 코어 · 검수 · 엑셀)
        run: dotnet test tests/Digitizer.App.Tests --logger "console;verbosity=normal"
      - name: 게시 (자체 포함 win-x64, 화면 포함)
        run: |
          dotnet publish src/Digitizer.App -c Release -r win-x64 --self-contained -o publish
          if (!(Test-Path publish/wwwroot/index.html)) { throw "게시 결과에 화면(wwwroot/index.html)이 없습니다" }
          if (Test-Path publish/package.json) { throw "화면 소스(package.json)가 게시 결과에 섞였습니다" }

  web:
    name: 웹 린트 · 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: 타입 검사 + 빌드
        run: npm run build

  python:
    name: Python 문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 서비스는 GPU 빌드(paddle·torch)가 필요해 설치하지 않고, 모든 파일이 컴파일되는지만 확인
      - run: python -m compileall -q src/OcrService src/CnnService eval
